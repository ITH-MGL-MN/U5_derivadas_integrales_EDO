name: Publicar teoría en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Construir el sitio
        run: python tools/build_site.py --salida _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
