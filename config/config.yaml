    x: [0.0, 0.1, 0.2, 0.3]
    f: [0.0, 0.0998, 0.1987, 0.2955]
  integracion_ejemplo:
    a: 0.0
    b: 1.0
    n: 4
  edo_paracaidista:
    g: 9.81
