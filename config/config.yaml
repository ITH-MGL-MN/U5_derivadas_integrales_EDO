# =====================================================================
#  Configuración de la unidad U5 — Derivadas, integrales y EDO.
# ---------------------------------------------------------------------
#  Combina la Parte 6 (diferenciación e integración numéricas) y la
#  Parte 7 (ecuaciones diferenciales ordinarias) del libro.
#
#  Cada cuaderno tiene su pestaña en la hoja de cálculo y sus intentos.
#  La teoría está en docs/, las funciones del alumno en ejercicios/ y
#  los blobs en grader/.
# =====================================================================
unidad:
  id: "U5"
  nombre: "Derivadas, integrales y EDO"
  materia: "Métodos Numéricos"
  temas:
    - "5.1 Derivación numérica"
    - "5.2 Integración numérica: trapecio, Simpson 1/3 y 3/8"
    - "5.3 Integración con intervalos desiguales"
    - "6.1 Fundamentos de ecuaciones diferenciales"
    - "6.2 Métodos de un paso: Euler, Euler mejorado, Runge-Kutta"
    - "6.3 Métodos de pasos múltiples"

# Un cuaderno = una pestaña del backend = un blob en grader/.
cuadernos:
  u5_01_derivacion: "U5_01_Derivacion_Numerica"
  u5_02_integracion: "U5_02_Integracion_Numerica"
  u5_03_edo_un_paso: "U5_03_EDO_Un_Paso"
  u5_04_edo_multipaso: "U5_04_EDO_Multipaso"

evaluacion:
  tolerancia_funcion: 1e-6      # comparación de las funciones programadas
  tolerancia_mano: 1.5e-4       # actividades a mano: 4 decimales, truncado o redondeo
  max_intentos: 2               # envíos permitidos (lo impone el Apps Script)
  accion: "guardar"
  # ⚠️ REEMPLAZAR por los valores reales al desplegar el Apps Script de U5.
  webhook_token: ""
  apps_script_url: ""

datos:
  # Ejemplos del libro usados en cuadernos y pruebas (se llenan tras
  # extraer las tablas de Contenido/Markdown/Ed7).
  derivacion_ejemplo:
    x: []
    f: []
  integracion_trapecio:
    a: 0.0
    b: 0.0
    n: 0
  edo_paracaidista:
    g: 9.81
    m: 68.1
    c: 12.5
